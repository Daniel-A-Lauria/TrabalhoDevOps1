services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: editor_markdown_app
    ports:
      - "8080:80"
    restart: always
    environment:
      - APP_ENV=production
      - REDIS_HOST=cache
    depends_on:
      - cache

  cache:
    image: redis:alpine
    container_name: editor_markdown_cache
    ports:
      - "6379:6379"
    restart: always
    volumes:
      - redis_data:/data

volumes:
  redis_data: